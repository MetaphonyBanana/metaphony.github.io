<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>My Site</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    a {
      color: cyan;
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
    }

    .banana-link img {
      width: 500px;
      max-width: 90vw;
      display: block;
      margin-bottom: 60px;
    }

    .articles {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      width: 100%;
      max-width: 900px;
    }

    .article-card {
      border: 1px solid #333;
      padding: 20px;
      text-align: center;
      transition: border-color 0.2s;
    }

    .article-card:hover {
      border-color: cyan;
    }

    .article-card a {
      display: block;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .articles {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <a class="banana-link" href="wave.html">
    <img src="a.png" alt="banana">
  </a>

  <div class="articles">
    <div class="article-card"><a href="article1.html">article 01</a></div>
    <div class="article-card"><a href="article2.html">article 02</a></div>
    <div class="article-card"><a href="article3.html">article 03</a></div>
    <div class="article-card"><a href="article4.html">article 04</a></div>
    <div class="article-card"><a href="article5.html">article 05</a></div>
    <div class="article-card"><a href="article6.html">article 06</a></div>
    <div class="article-card"><a href="article7.html">article 07</a></div>
    <div class="article-card"><a href="article8.html">article 08</a></div>
    <div class="article-card"><a href="article9.html">article 09</a></div>
  </div>

</body>
</html>
